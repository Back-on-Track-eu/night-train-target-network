name: Backend Integration Tests

on:
  push:
    branches: [staging, production, backend-dev]
    paths:
      - 'backend/**'
      - 'docs/MODEL.md'
      - '.devcontainer/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [staging, production]
    paths:
      - 'backend/**'
      - 'docs/MODEL.md'
      - '.devcontainer/**'
      - '.github/workflows/backend-tests.yml'

jobs:

  # ============================================================
  # JOB 0 — docs/MODEL.md freshness
  # Fails if the generated blocks in docs/MODEL.md no longer match the
  # model registries (models/*/model.py) or the schema (db/schema.py).
  # ============================================================
  model-docs-check:
    name: MODEL.md up-to-date check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs/MODEL.md against the registries
        run: python backend/scripts/generate_model_docs.py --check

  # ============================================================
  # JOB 1 — Version bump enforcement
  # Fails if a model file changed but its version constant did not.
  # ============================================================
  version-check:
    name: Version bump check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for diff

      - name: Check version bumps
        run: |
          # Fetch the PR base branch so we can diff against it
          git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true

          # Base ref: PR base branch on PRs, previous commit on push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            # On first push or force push, event.before may be all zeros
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "First push — skipping version check."
              exit 0
            fi
          fi

          FAIL=0

          check_version() {
            local model_file="$1"
            local version_file="$2"
            local version_const="$3"

            # Check if model file changed
            if git diff --name-only "$BASE" HEAD -- "$model_file" | grep -q .; then
              # Get old and new version constants
              old_ver=$(git show "$BASE:$version_file" 2>/dev/null | grep "^${version_const}" | grep -oP '"\K[^"]+(?=")' | head -1)
              new_ver=$(grep "^${version_const}" "$version_file" 2>/dev/null | grep -oP '"\K[^"]+(?=")' | head -1)

              if [ "$old_ver" = "$new_ver" ]; then
                echo "❌  VERSION NOT BUMPED: $model_file changed but $version_const stayed at '$new_ver'"
                echo "    Please update $version_const in $version_file"
                FAIL=1
              else
                echo "✓  $version_const bumped: $old_ver → $new_ver  ($model_file changed)"
              fi
            fi
          }

          # Route builder
          for f in \
            backend/models/route/route_factory.py \
            backend/models/route/trip.py \
            backend/models/route/route.py \
            backend/models/route/timetable.py \
            backend/models/route/routing/rail_router.py \
            backend/models/route/routing/dynamics.py; do
            check_version "$f" \
              "backend/models/route/model.py" \
              "ROUTE_BUILDER_VERSION"
          done

          # Energy model
          check_version \
            "backend/models/energy/calc_energy_consumption.py" \
            "backend/models/energy/model.py" \
            "ENERGY_CALC_VERSION"

          # Cost/revenue evaluation
          for f in \
            backend/models/evaluation/calc.py \
            backend/models/evaluation/views.py \
            backend/models/evaluation/summary.py; do
            check_version "$f" \
              "backend/models/evaluation/model.py" \
              "CALC_VERSION"
          done

          # Demand model (stopgap)
          check_version \
            "backend/models/demand/stopgap.py" \
            "backend/models/demand/model.py" \
            "DEMAND_MODEL_VERSION"

          # Models whose entire content is model.py (emissions factor set,
          # composition cost calibration anchor, infrastructure parameter
          # anchor): self-gate — any diff to the file requires its own
          # version constant to move.
          check_version \
            "backend/models/emissions/model.py" \
            "backend/models/emissions/model.py" \
            "EMISSIONS_MODEL_VERSION"

          check_version \
            "backend/models/compositions/model.py" \
            "backend/models/compositions/model.py" \
            "COMPOSITIONS_MODEL_VERSION"

          check_version \
            "backend/models/infrastructure/model.py" \
            "backend/models/infrastructure/model.py" \
            "INFRA_MODEL_VERSION"

          # Demand model.py self-gate (standard values live in the file)
          check_version \
            "backend/models/demand/model.py" \
            "backend/models/demand/model.py" \
            "DEMAND_MODEL_VERSION"

          # Route/evaluation/energy model.py self-gates: these three carry
          # the formula registries (LaTeX + description + I/O legend) and
          # can change on their own — e.g. rewording a description — with
          # no implementation file touched, which the implementation-file
          # pairings above would not catch. Self-gate closes that gap.
          check_version \
            "backend/models/route/model.py" \
            "backend/models/route/model.py" \
            "ROUTE_BUILDER_VERSION"

          check_version \
            "backend/models/evaluation/model.py" \
            "backend/models/evaluation/model.py" \
            "CALC_VERSION"

          check_version \
            "backend/models/energy/model.py" \
            "backend/models/energy/model.py" \
            "ENERGY_CALC_VERSION"

          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "One or more model files were changed without bumping the version."
            echo "Update the version constant and add a CHANGELOG entry before merging."
            exit 1
          fi

          echo ""
          echo "All version checks passed."

  # ============================================================
  # JOB 2 — Integration tests
  # ============================================================
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: version-check
    timeout-minutes: 30

    env:
      POSTGRES_HOST:     localhost
      POSTGRES_PORT:     5432
      POSTGRES_DB:       target_network_test_db
      POSTGRES_USER:     bot_admin
      POSTGRES_PASSWORD: devpassword

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Cache the OpenRailRouting graph
      # ------------------------------------------------------------------
      - name: Cache OpenRailRouting graph
        id: cache-graph
        uses: actions/cache@v4
        with:
          path: backend/models/route/routing/docker/graph-cache
          key: openrailrouting-graph-${{ hashFiles('backend/models/route/routing/docker/config.yml') }}

      - name: Download graph cache if not cached
        if: steps.cache-graph.outputs.cache-hit != 'true'
        run: |
          mkdir -p backend/models/route/routing/docker/graph-cache
          # The id's one home is the routing container's entrypoint default
          # (AGENTS.md "Parameter placement") — read it from there.
          FILE_ID=$(grep -oP 'GRAPH_CACHE_FILE_ID:-\K[^}]+' \
            backend/models/route/routing/docker/entrypoint.sh)
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl -L "$URL" -o /tmp/graph-cache.zip
          unzip -o /tmp/graph-cache.zip -d backend/models/route/routing/docker/graph-cache
          rm /tmp/graph-cache.zip

      # ------------------------------------------------------------------
      # Inject GIT_SHA into model files before building Docker image
      # ------------------------------------------------------------------
      - name: Inject GIT_SHA into model files
        run: |
          SHA="${{ github.sha }}"
          echo "Injecting GIT_SHA=${SHA} into model files..."
          for f in \
            backend/models/route/model.py \
            backend/models/energy/model.py \
            backend/models/evaluation/model.py; do
            sed -i "s/GIT_SHA: str = \"unknown\"/GIT_SHA: str = \"${SHA}\"/" "$f"
            echo "  ✓ $f"
          done

      # ------------------------------------------------------------------
      # Start the full backend stack
      # ------------------------------------------------------------------
      - name: Start Docker stack
        run: |
          cd backend/docker
          cp .env.example .env
          # Auth config for the CI stack: dev-mode OTPs (logged, not
          # mailed), rate limits off, throwaway JWT secret.
          {
            echo "JWT_SECRET=ci-only-throwaway-secret"
            echo "AUTH_EMAIL_DEV_MODE=true"
            echo "TESTING=true"
          } >> .env
          # CI loads ONTD as an explicit, ORDERED step below instead of
          # the entrypoint's background load — the background load races
          # the test suite (mid-run catalog/projection changes skewed
          # whichever tests it overtook). sed, not append: the key
          # already exists in .env.example, and one unambiguous value
          # beats relying on last-occurrence-wins semantics.
          sed -i 's/^ONTD_BOOTSTRAP=.*/ONTD_BOOTSTRAP=off/' .env
          docker compose up -d --build
        env:
          POSTGRES_USER:     bot_admin
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB:       target_network_test_db
          POSTGRES_PORT:     5432

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API..."
          API_HOST_PORT=$(grep -oP '^API_HOST_PORT=\K.*' backend/docker/.env)
          attempts=0
          until curl -sf "http://localhost:${API_HOST_PORT:-5050}/api/health" > /dev/null; do
            attempts=$((attempts + 1))
            if [ $attempts -ge 60 ]; then
              echo "API did not become healthy after 2 minutes"
              docker compose -f backend/docker/docker-compose.yml logs
              exit 1
            fi
            sleep 2
          done
          echo "API is healthy."

      # ------------------------------------------------------------------
      # Load ONTD reference data — explicit and ordered
      # ------------------------------------------------------------------
      # In production the entrypoint runs this in the background
      # (soft-fail, API up in seconds — the right trade there). In CI the
      # opposite is right: tests like test_52's sources=["existing"]
      # union need ontd.route_summaries populated BEFORE pytest starts,
      # and a load failure should fail the build loudly, not skew
      # results. --force overrides the stack's ONTD_BOOTSTRAP=off;
      # --strict makes step failure exit non-zero.
      - name: Load ONTD reference data
        run: docker exec night-train-api python /app/db/ontd/bootstrap.py --force --strict

      # ------------------------------------------------------------------
      # Build the country relation candidate set — explicit and ordered
      # ------------------------------------------------------------------
      # Same reasoning as the ONTD load above: the entrypoint runs this in
      # the background (right for production, API up in seconds), but
      # test_55's relation rankings need input_params.country_relations
      # populated BEFORE pytest starts, and a build failure should fail the
      # build loudly rather than silently skip those tests. --strict makes
      # an empty result exit non-zero.
      - name: Build country relations
        run: docker exec night-train-api python /app/scripts/build_country_relations.py --strict

      # ------------------------------------------------------------------
      # Set up Python and run tests
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          cd backend
          uv sync --extra dev

      - name: Run integration tests
        run: |
          API_HOST_PORT=$(grep -oP '^API_HOST_PORT=\K.*' backend/docker/.env)
          export API_BASE_URL="http://localhost:${API_HOST_PORT:-5050}"
          cd backend
          uv run --extra dev pytest tests/ -v --timeout=60
        env:
          POSTGRES_HOST:     localhost
          POSTGRES_PORT:     5432
          POSTGRES_DB:       target_network_test_db
          POSTGRES_USER:     bot_admin
          POSTGRES_PASSWORD: devpassword

      # ------------------------------------------------------------------
      # Always print logs on failure
      # ------------------------------------------------------------------
      - name: Print Docker logs on failure
        if: failure()
        run: docker compose -f backend/docker/docker-compose.yml logs