# Pre-commit hooks for night-train-target-network
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python formatting (backend)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-format
        files: ^backend/

  # JS/TS/Vue/JSON/CSS/Markdown formatting (frontend + docs-site)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^(frontend|docs-site)/
        # The emitter owns docs-site/cost/ and docs-site/reference/ and its
        # --check gate verifies them byte for byte, so prettier reformatting
        # them turns every CI run into a drift failure. docs-site's own
        # .prettierignore does NOT cover this: pre-commit runs prettier from
        # the repo root, where that file is not consulted — hence an explicit
        # exclude here as well.
        exclude: ^docs-site/(cost|reference)/|^docs-site/\.vitepress/generated-sidebar\.json$
        types_or: [javascript, jsx, ts, tsx, vue, json, css, markdown]
        additional_dependencies:
          - prettier@3.5.3
