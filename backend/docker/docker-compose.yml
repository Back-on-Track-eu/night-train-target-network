# =============================================================================
# Night Train — Backend Services
# =============================================================================
# Services:
#   postgres         — PostgreSQL database (seeded on API startup)
#   openrailrouting  — rail routing engine (GraphHopper fork)
#   api              — Flask REST API (seeds db then starts)
#
# Usage:
#   cd backend/docker
#   cp .env.example .env
#   docker-compose up -d
#
# All configuration lives in .env — see .env.example for reference. Port
# fallbacks below (${VAR:-value}) are sanctioned mirrors of .env.example and
# must stay equal to it (AGENTS.md "Parameter placement").
#
# The devcontainer runs THIS stack plus a frontend, as a compose overlay —
# see .devcontainer/docker-compose.yml. The explicit project name keeps both
# entry points on one project (same containers, same volumes).

name: night_train

services:

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: night_train_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  openrailrouting:
    build:
      context: ../models/route/routing/docker
      dockerfile: Dockerfile
    image: docker-openrailrouting
    container_name: openrailrouting
    environment:
      GRAPH_CACHE_FILE_ID: ${GRAPH_CACHE_FILE_ID:-}
    ports:
      - "${OPENRAILROUTING_HOST_PORT:-8989}:${OPENRAILROUTING_CONTAINER_PORT:-8989}"
    volumes:
      - ../models/route/routing/docker/data:/app/data
      # Repo-relative, resolved against the compose project directory
      # (backend/docker/) exactly like the ../models mount above. NOT an
      # .env value: it is the same path on every laptop, in CI (where
      # backend-tests.yml's actions/cache restores this very directory) and
      # on the servers, so by the parameter-placement rules it has no
      # business in .env. It was one until 2026-08-24, holding a
      # CONTAINER-side /app/... value that silently bind-mounted an empty
      # root-owned directory on Linux and failed outright on macOS; hard-
      # coding it here makes a stale GRAPH_CACHE_PATH in an existing .env
      # inert rather than actively wrong.
      - ../models/route/routing/docker/graph-cache:/app/graph-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${OPENRAILROUTING_CONTAINER_PORT:-8989}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker-api
    container_name: night-train-api
    ports:
      - "${API_HOST_PORT:-5050}:${API_CONTAINER_PORT:-5000}"
    env_file:
      - .env
    environment:
      # Overrides for inter-container networking — service name as host, and
      # the container-side ports regardless of what the host publishes.
      POSTGRES_HOST:        postgres
      POSTGRES_PORT:        "5432"
      OPENRAILROUTING_URL:  http://openrailrouting:${OPENRAILROUTING_CONTAINER_PORT:-8989}
    depends_on:
      postgres:
        condition: service_healthy
      openrailrouting:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
