<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Nested sets, following Johanna's sketch (StopInvestigation.pptx) -->

  <!-- All OSM station objects (step 2 output) -->
  <ellipse cx="270" cy="270" rx="245" ry="235" fill="#dae3f3" stroke="#5b7fb5" stroke-width="2"/>

  <!-- A: real railway stations after classification (step 3) -->
  <ellipse cx="290" cy="285" rx="195" ry="185" fill="#8faadc" stroke="#3f5f96" stroke-width="2"/>
  <text x="215" y="165" font-size="26" fill="#1f3864" font-weight="bold">A</text>

  <!-- Red dashed: stations in metro regions / functional urban areas (step 6 anchor set) -->
  <!-- drawn before B/C-T1 so the qualified sets stay readable on top -->
  <ellipse cx="392" cy="290" rx="62" ry="118" fill="#f8cbad" fill-opacity="0.85" stroke="none"/>

  <!-- B: merged catalog, OSM x ONTD (step 4) -->
  <ellipse cx="310" cy="320" rx="120" ry="112" fill="#ffc000" stroke="#bf8f00" stroke-width="2"/>
  <text x="268" y="290" font-size="26" fill="#7f6000" font-weight="bold">B</text>

  <!-- C-T1: current night train stops from stop_times (step 5, Tier 1) -->
  <ellipse cx="385" cy="378" rx="52" ry="46" fill="#c55a11" stroke="#833c00" stroke-width="2"/>
  <text x="385" y="385" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">C-T1</text>

  <ellipse cx="392" cy="290" rx="62" ry="118" fill="none" stroke="#ff0000" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- Legend -->
  <g font-size="15" fill="#333333">
    <ellipse cx="600" cy="60" rx="34" ry="30" fill="#dae3f3" stroke="#5b7fb5" stroke-width="2"/>
    <text x="655" y="55">All OSM station objects — step 2 filter output</text>
    <text x="655" y="75" font-size="13" fill="#666666">railway=station/halt or public_transport=station (98,944)</text>

    <ellipse cx="600" cy="150" rx="34" ry="30" fill="#8faadc" stroke="#3f5f96" stroke-width="2"/>
    <text x="586" y="158" font-size="20" fill="#1f3864" font-weight="bold">A</text>
    <text x="655" y="140">Real railway stations — step 3 classification</text>
    <text x="655" y="160" font-size="13" fill="#666666">subway, tram, ferry terminals etc. marked and excluded</text>
    <text x="655" y="178" font-size="13" fill="#666666">from evaluation (rows kept, filter on station_mode)</text>

    <ellipse cx="600" cy="245" rx="34" ry="30" fill="#ffc000" stroke="#bf8f00" stroke-width="2"/>
    <text x="588" y="253" font-size="20" fill="#7f6000" font-weight="bold">B</text>
    <text x="655" y="235">Merged catalog — step 4 (left join with ONTD)</text>
    <text x="655" y="255" font-size="13" fill="#666666">osm_id + lat/lon from OSM · names, country code and</text>
    <text x="655" y="273" font-size="13" fill="#666666">old stop charge data from ONTD</text>

    <ellipse cx="600" cy="340" rx="34" ry="30" fill="#c55a11" stroke="#833c00" stroke-width="2"/>
    <text x="581" y="347" font-size="15" fill="#ffffff" font-weight="bold">C-T1</text>
    <text x="655" y="330">Current night train stops — step 5 (Tier 1)</text>
    <text x="655" y="350" font-size="13" fill="#666666">stop_times table of the night train database,</text>
    <text x="655" y="368" font-size="13" fill="#666666">duplicates removed</text>

    <ellipse cx="600" cy="435" rx="34" ry="30" fill="none" stroke="#ff0000" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="655" y="428">Stations in metro regions (functional urban areas)</text>
    <text x="655" y="448" font-size="13" fill="#666666">step 6: FUAs without any C-T1 stop → add qualified</text>
    <text x="655" y="466" font-size="13" fill="#666666">stations manually (shaded part of the dashed set)</text>
  </g>

  <text x="30" y="540" font-size="13" fill="#6c757d">Qualified night train stop candidates = C-T1 ∪ step 6 additions, drawn from catalog B · step 7 refreshes the station charge data on that set</text>
</svg>
