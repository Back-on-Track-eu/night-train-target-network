[project]
name = "night-train-target-network"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-limiter>=3.5",
    "gunicorn>=23.0.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.12",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "pyshp>=2.3",
    "pandas-stubs>=3.0.3.260530",
    "osmium>=4.3.1",
    "unidecode>=1.4.0",
    "pandas>=3.0.3",
    "geopandas>=1.1.4",
    "pyproj>=3.7.2",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "transliterate>=1.10.2",
    "regex>=2026.7.19",
    "pycountry>=26.2.16",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.21",
    "jupyterlab>=4.6.0",
    "matplotlib>=3.10",
    "pandas>=3.0.3",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "tqdm>=4.70.0",
    "psutil>=7.2.2",
    # Drive folder sync for the stop classification pipeline's bulk inputs
    # (models/infrastructure/stops/data_sources.py). Drive cannot list a folder
    # over plain HTTP, so this is the one dependency that can.
    "gdown>=5.2.0",  # 5.x and 6.x differ; data_sources.py handles both
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
