# =============================================================================
# Target Network — DEMO/DEV stack on bot-server (second instance)
# =============================================================================
# Runs current main alongside the untouched June-23 "prod" stack
# (/opt/targetnetwork), with its own Postgres — this is the Trello Stream-2
# card "test database as a second instance, prod vs dev distinguished" and
# the Stream-3 card "initial deployment of first view".
#
# The heavy OpenRailRouting JVM is NOT duplicated: this stack joins the
# prod stack's network and reuses targetnetwork-routing (config.yml and
# custom_models are identical between the deployed build and main —
# verified 2026-07-14; the engine is stateless per request).
#
# House pattern: nothing publishes a public port except a localhost debug
# bind. Public access = Caddy vhost on the shared nextcloud_nextcloud
# network. See README.md in this directory for the full runbook, the Caddy
# vhost block, and the restart-not-reload gotcha.
#
# First-time setup on the server:
#   cd /opt/targetnetwork-demo/deploy/bot-server-demo
#   cp .env.example .env && vim .env   # fill values (chmod 600)
#   docker compose build
#   docker compose up -d db
#   docker compose run --rm api python db/dev/seed.py   # one-time seed
#   docker compose up -d
# =============================================================================
name: targetnetwork-demo

services:

  db:
    image: postgis/postgis:16-3.4
    container_name: tn-demo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - tn_demo_pgdata:/var/lib/postgresql/data
      # Schema-only init on first boot (empty volume). Only the two
      # schemas that still have a .sql file: input_params and
      # scenario are rendered from backend/db/schema.py now (build_ddl()),
      # and mounting their deleted files here made Docker create
      # DIRECTORIES in their place, which aborts postgres initdb. seed.py
      # re-creates every schema from the same sources anyway, so these two
      # are belt-and-braces for a fresh boot, not the real path.
      - ../../backend/db/dev/sql/create_admin_schema.sql:/docker-entrypoint-initdb.d/01_admin.sql:ro
      - ../../backend/db/dev/sql/create_proposal_schema.sql:/docker-entrypoint-initdb.d/04_proposals.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../../backend
      dockerfile: docker/Dockerfile
    container_name: tn-demo-api
    # Skip the image's seed-on-start entrypoint (it begins with
    # DROP SCHEMA ... CASCADE): seed once manually via `compose run`,
    # then this stack only ever starts gunicorn.
    # gthread worker model (WP14): GUNICORN_WORKERS processes x
    # GUNICORN_THREADS request threads each; adapters share one DB pool
    # per process (DB_POOL_MAX). Sizing rules in docs/DEPLOY_HANDOVER.md.
    command:
      [
        "gunicorn",
        "--bind", "0.0.0.0:5000",
        "--worker-class", "gthread",
        "--workers", "${GUNICORN_WORKERS:-2}",
        "--threads", "${GUNICORN_THREADS:-8}",
        "--timeout", "120",
        "main:create_app()",
      ]
    environment:
      # Container name, NOT the service alias "db": this container also joins
      # the prod stack's network (for routing), where prod's compose registers
      # its own "db" alias — the bare name is ambiguous across networks.
      - POSTGRES_HOST=tn-demo-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Reuse the prod stack's routing engine (see header).
      - OPENRAILROUTING_URL=http://targetnetwork-routing:8989
      # Baked into the image at build time; seed.py reads it to populate
      # input_params.countries.country_geom (CountryIndex source).
      - EEZ_LAND_UNION_FILE_ID=${EEZ_LAND_UNION_FILE_ID}
    ports:
      - "127.0.0.1:5056:5000"   # debug access from the box; public = Caddy
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - caddy_net
      - tn_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      # docs-site/ is outside the frontend context; naming it here keeps the
      # main context narrow (see frontend/Dockerfile.demo). Needs Compose
      # v2.17+ / BuildKit.
      additional_contexts:
        docssrc: ../../docs-site
      dockerfile: Dockerfile.demo
      args:
        VITE_API_BASE_URL: ""   # same-origin /api/* — Caddy routes to tn-demo-api
    container_name: tn-demo-frontend
    networks:
      - default
      - caddy_net
    restart: unless-stopped
    # Caddy vhost: targetnetwork.65.109.137.97.sslip.io
    #   handle /api/*  → tn-demo-api:5000
    #   handle         → tn-demo-frontend:80

volumes:
  tn_demo_pgdata:

networks:
  caddy_net:
    external: true
    name: nextcloud_nextcloud
  tn_prod:
    external: true
    name: targetnetwork_default
