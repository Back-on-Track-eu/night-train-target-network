# SPA fallback for the vue-router history-mode app (Dockerfile.demo) — any
# path that isn't a real static asset falls back to index.html so client-side
# routes (e.g. /proposal/12) work on a direct load or refresh, not just when
# navigated to in-app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
