# SPA fallback for the vue-router history-mode app (Dockerfile.demo) — any
# path that isn't a real static asset falls back to index.html so client-side
# routes (e.g. /proposal/12) work on a direct load or refresh, not just when
# navigated to in-app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Documentation site (VitePress, built with base '/docs/'). Must come
    # before the SPA catch-all: nginx prefers the most specific prefix, and
    # without it every /docs/* request would fall through to the app's
    # index.html and return 200 with a blank page instead of a 404.
    # cleanUrls is on, so /docs/cost/tac is served by cost/tac.html.
    location /docs/ {
        # try_files falling back to a page would serve it as 200; =404 plus
        # error_page keeps the status honest while still rendering
        # VitePress's own styled 404.
        error_page 404 /docs/404.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
