        falls *outside* it. A target that wants it in must say so in
        `force_in`, with a reason.
    scope:
      bbox: [46.70, 11.20, 47.30, 11.60]
    changes:
      - promote: construction
      - promote: proposed
    osm:
      lifecycle: [construction, proposed]
      failure_modes: [lifecycle-value, namespaced-attrs, unconnected]
    probe:
      from: { name: Innsbruck Hbf, lat: 47.2632, lon: 11.4011 }
      to: { name: Bolzano/Bozen, lat: 46.4770, lon: 11.3260 }
      via_bbox: [46.70, 11.20, 47.30, 11.60]
