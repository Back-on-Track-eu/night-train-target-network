# European rail construction projects that change what a router sees.
#
# Every project we know about, at every horizon. Which of them are in a given
# network is decided by comparing an opening date against a target's `as_of`,
# so this one file produces a 2032 network and a 2040 one with no edit. There
# is deliberately no in/out flag: a hand-set boolean that nothing checks against
# the dates beside it is a second source of truth waiting to disagree with the
# first.
#
# ---------------------------------------------------------------- what is here
#
# A project belongs here if it changes what a *router* sees:
#   - topology — a new link, a new alignment, a reopened corridor; or
#   - a tag the night_train profile reads — gauge, maxspeed, service.
#
# Capacity work alongside an existing route, resignalling, and station rebuilds
# that do not move a junction are out: the router takes the same path before and
# after, so the economic model does not move. Stuttgart 21 is here not because
# the station is bigger but because long-distance trains stop reversing at a
# terminus and run through onto the Wendlingen–Ulm line. The junction moves.
#
# Work that changes no route at *any* date is listed under `irrelevant:` at the
# bottom, with the reason — that is a different thing from "not open yet", and
# conflating the two was a real bug in the file this replaces.
#
# ------------------------------------------------------------------ per project
#
#   opening.official   the operator's own target date
#   opening.latest     the most recent reported date, where it differs.
#                      Targets default to `date_basis: latest`, the pessimistic
#                      one, because megaprojects slip late and rarely early.
#   scope              WHERE the changes apply. `ways:` is precise and cheap;
#                      `bbox:` is coarse and forces a node-location index.
#                      Run `osm-survey corridors` to turn a bbox into way ids.
#   changes            WHAT is done, from changes/library.yml
#   probe              two well-connected stations whose best path should move
#                      once this opens, plus the box the new path must pass
#                      through. `osm-pipe verify` uses these as the test.
#   osm.failure_modes  why GraphHopper cannot route it today. Vocabulary and
#                      full discussion in doc-jasper/future-network-2032.md.
#
# Dates were researched on 2026-08-16 and are a claim, not a fact. Re-check any
# marginal one before publishing a result that depends on it.
#
# ------------------------------------------------------------------- known gap
#
# Every `scope` below is a bbox, because no corridor has been surveyed for way
# ids yet. Bboxes are coarse — Rail Baltica's spans 54.3–59.5°N and contains a
# good deal of unrelated planned track, and *any* single node inside the box
# puts a whole way in scope. Until `osm-survey corridors` has run over each
# corridor and filled in `scope.ways`, treat per-project attribution as
# approximate. The `ntn:project` marker on every rewritten way is what makes a
# specific route auditable in the meantime.

name: europe
description: European rail projects that change routing, at every horizon

projects:
  # ============================================================== Nordics ===

  - id: fehmarn-belt
    name: Fehmarn Belt Fixed Link
    corridor: Puttgarden (DE) – Rødbyhavn (DK)
    countries: [DE, DK]
    impact: new-link
    opening:
      official: "2029-06"
      latest: "2031"
      note: >-
        Femern A/S confirmed in January 2026 that opening is no longer expected
        before 2031. The benchmark case for the whole pipeline: it cuts
        Hamburg–Copenhagen from roughly seven hours to four.
    scope:
      bbox: [54.30, 10.90, 54.80, 11.65]
    changes:
      - promote: construction
      # The corridor is severed south of the tunnel: a bbox query over Fehmarn
      # island returned 29 construction ways, 127 disused, 24 abandoned and
      # exactly *one* railway=rail. The Vogelfluglinie has carried no trains
      # since 31 August 2022. Promoting construction alone leaves a hole.
      #
      # `untyped: true` matters here and was found the hard way. 25 ways in
      # this chain carry a bare `railway=disused` with no `disused:railway`
      # sub-tag, and skipping them broke the corridor at the Fehmarn Sound —
      # Grossenbrode to Burg, a 12 km hop, routed 648 km round via Jutland.
      # A weaker claim than the prefixed spelling, which is why it is opt-in,
      # but inside this project's box it is the same closed line.
      - promote: { lifecycle: disused, untyped: true }
      - drop_oneway
    osm:
      lifecycle: [construction, disused, abandoned]
      failure_modes:
        - lifecycle-value
        - namespaced-attrs
        - oneway-single-track
        - corridor-disused
      verified: "2026-08-16"
      note: >-
        The belt crossing is a chain of railway=construction ways (976707770 →
        304926270 → 149084842 → 944021059), each sharing a node with the next,
        so this corridor is internally connected — its problems are tagging,
        not topology. Every one of them is oneway=yes with no twin mapped
        alongside. gauge/electrified/voltage/frequency sit under the
        construction: prefix while maxspeed, highspeed and usage do not, which
        is typical but not guaranteed.

        Those four way ids are the obvious first `scope.ways` to fill in.

        SURVEYED 2026-08-29 on -d fehmarn. Two findings, both arguing for
        scope.ways over this bbox:

        (1) OSM draws the belt crossing and the whole German hinterland as ONE
        connected chain — corridor 14994826 "Vogelfluglinie", 287 km over 397
        ways (249 disused, 66 abandoned, 45 construction, 34 proposed), touching
        routable track at only 7 nodes. It carries maxspeed=200, gauge=1435,
        opening_date=2029 and oneway=yes throughout. So this project and
        fehmarn-hinterland-de are not separable by way id without splitting
        that chain by hand at the coast.

        (1a) The corridor is continuous once `untyped: true` is set, and the
        probe passes: Hamburg–København goes 518 km / 238 min via Jutland at
        today's date and 351 km / 153 min through the tunnel at 2032, −85 min.
        Lübeck–Nykøbing Falster goes 514 km / 247 min to 143 km / 57 min.

        (2) `promote: disused` here also catches "Inselbahn Fehmarn" (corridor
        116716354, 12.2 km, disused/abandoned/razed, attached to nothing) — a
        historic island railway that is gone, not being rebuilt. It currently
        does no harm because it forms an isolated component below
        min_network_size and GraphHopper deletes it, which is most of this
        project's 14.6 km of `pruned` track. But it is being promoted, and on
        a different extract or a lower min_network_size it would not be caught.
        Fixing it properly means replacing this bbox with a reviewed way list.
    probe:
      from: { name: Hamburg Hbf, lat: 53.5528, lon: 10.0065 }
      to: { name: København H, lat: 55.6727, lon: 12.5641 }
      via_bbox: [54.30, 10.90, 54.80, 11.65]
      baseline: Jutland and the Great Belt, roughly 470 km
    sources:
      - title: Fehmarnbelt Fixed Link (German transport ministry)
        url: https://www.bmv.de/EN/Topics/EU-Policy/EU-Transport-Policy/Fehmarnbelt/fehmarnbelt-fixed-link.html
      - title: Fehmarn Belt tunnel opening set for mid-2029
        url: https://www.globalhighways.com/wh10/news/fehmarn-belt-tunnel-opening-set-mid-2029
      - title: Fehmarnbelt Tunnel project profile (delay to 2031)
        url: https://www.blackridgeresearch.com/project-profiles/femern-fehmarn-belt-tunnel-fixed-link-project-tunnel-between-germany-and-denmark

  - id: fehmarn-hinterland-de
    name: Fehmarnbelt German hinterland (Lübeck–Puttgarden)
    corridor: Lübeck – Neustadt – Fehmarn – Puttgarden (DE)
    countries: [DE]
    impact: new-alignment
    opening:
      official: "2029"
      latest: "2029"
      note: >-
        88 km rebuilt as double-track electrified 200 km/h, 55 km of it on new
        alignment, plus the Fehmarn Sound tunnel. Without this the belt tunnel
        connects to nothing on the German side. All rail traffic north of
        Neustadt has been suspended since 31 August 2022.
    scope:
      bbox: [53.85, 10.60, 54.55, 11.35]
    changes:
      - promote: construction
      - promote: disused
      # The rebuild follows the old Vogelfluglinie alignment, so here the
      # abandoned way *is* the alignment. A stronger claim than reopening a
      # disused line, and scoped tighter for that reason.
      - promote: abandoned
      - drop_oneway
    osm:
      lifecycle: [construction, disused, abandoned]
      failure_modes:
        - lifecycle-value
        - namespaced-attrs
        - corridor-disused
        - unconnected
      verified: "2026-08-16"
      note: >-
        The German and Danish sides are not symmetric. Rødbyhavn returned 9
        railway=rail ways against 54 disused; the German side has effectively
        none. This 88 km is where the hole is, which is why the reopening
        changes are scoped to this project and its neighbour rather than
        applied Europe-wide.

        Measured on the fehmarn dataset: this project promotes 157 ways, all
        of them disused or abandoned and NOT ONE of them construction. The
        rebuild has not been drawn as railway=construction — OSM still shows
        the old alignment out of service and nothing new beside it. So
        `promote: construction` is kept for when that changes, and reports
        zero until it does. Note also that this box overlaps fehmarn-belt's,
        which appears first and therefore claims the ways on Fehmarn island.
    probe:
      from: { name: Lübeck Hbf, lat: 53.8697, lon: 10.6699 }
      to: { name: Nykøbing Falster, lat: 54.7697, lon: 11.8686 }
      via_bbox: [54.30, 10.90, 54.80, 11.65]
      baseline: no direct path — falls back to Jutland
    sources:
      - title: Rail link for the Fehmarn Belt Fixed Link (DB E&C)
        url: https://db-engineering-consulting.com/en/projects/rail-link-for-the-fehmarn-belt-fixed-link/
      - title: Bahnstrecke Lübeck–Puttgarden (closure since 31 Aug 2022)
        url: https://de.wikipedia.org/wiki/Bahnstrecke_L%C3%BCbeck%E2%80%93Puttgarden

  - id: norrbotniabanan
    name: Norrbotniabanan
    corridor: Umeå – Skellefteå – Luleå (SE)
    countries: [SE]
    impact: new-alignment
    opening:
      official: "2035"
      latest: "2035"
      note: >-
        Dated by its middle section, not its first. Umeå–Dåva opens for freight
        in 2026 and Skellefteå–Luleå before 2030, but Dåva–Skellefteå is not
        expected until 2035 — and a corridor with a hole in the middle changes
        no journey time. Two thirds of a link is not two thirds of a benefit;
        it is none of it. The official 2030 date refers to sections that do not
        on their own change a path, so it is not recorded as this project's
        opening.
    scope:
      bbox: [63.70, 20.10, 65.70, 22.30]
    changes:
      - promote: construction
      - promote: proposed
    osm:
      lifecycle: [construction, proposed]
      failure_modes: [lifecycle-value, unconnected, pruned]
    sources:
      - title: North Bothnia Line
        url: https://en.wikipedia.org/wiki/North_Bothnia_Line
      - title: Norrbotniabanan (Skellefteå kommun)
        url: https://skelleftea.se/invanare/startsida/trafik-och-samhallsutveckling/resor-och-transporter/norrbotniabanan

  - id: dk-electrification
    name: Danish electrification programme
    corridor: Fredericia – Aalborg – Frederikshavn, Vejle – Struer, Roskilde – Kalundborg (DK)
    countries: [DK]
    impact: electrification
    opening:
      official: "2026"
      latest: "2029"
      note: >-
        Attribute-only. The night_train profile does not gate on electrification
        (the assumed Vectron Dual Mode has diesel fallback), so routing is
        unchanged — but the energy model is electrification-aware, so an
        unwired-looking corridor is costed as diesel.
    scope:
      bbox: [54.90, 8.00, 57.80, 12.80]
    # Deliberately empty, and a known gap rather than an oversight. Setting
    # electrified=contact_line over this bbox would wire every unelectrified
    # branch line in Denmark, which is a worse error than leaving it. It needs
    # `scope.ways` for the four named corridors first — run `osm-survey
    # corridors -d fehmarn --bbox 54.9,8.0,57.8,12.8`. Until then the energy
    # model reads these corridors as diesel, which is today's behaviour.
    changes: []
    osm:
      lifecycle: [rail]
      failure_modes: [namespaced-attrs]
      note: >-
        No routing failure. Listed so the energy side of the model does not
        quietly assume diesel on a corridor that will be wired, and so the gap
        is recorded rather than forgotten.
    sources:
      - title: Electrification Programme (Banedanmark)
        url: https://uk.bane.dk/en/Projects/Electrification-Programme
      - title: Danish electrification programme faces delays (IRJ)
        url: https://www.railjournal.com/infrastructure/danish-electrification-programme-faces-delays/

