  # ============================================ Baltics and central Europe ===

  - id: rail-baltica
    name: Rail Baltica
    corridor: Tallinn – Riga – Panevėžys – Kaunas – Warszawa (EE, LV, LT, PL)
    countries: [EE, LV, LT, PL]
    impact: gauge
    opening:
      official: "2030"
      latest: "2035"
      note: >-
        870 km of new 1435 mm line — the single largest network change in the
        catalogue for a night train model, and the one whose date is least
        safe. Officials describe a 2030 Warsaw–Tallinn service as an aspiration
        rather than a guarantee, Latvia now points at 2035, and phase 1 is
        single-track.
    scope:
      bbox: [54.30, 21.00, 59.50, 25.50]
    changes:
      # `untyped: true` on both: the surveyed chain is 305 ways, of which 26
      # carry a bare `railway=<stage>` with no sub-tag. Skipping those severs
      # the corridor mid-way — the same failure that broke Semmering and the
      # Fehmarn Sound.
      - promote: { lifecycle: construction, untyped: true }
      - promote: { lifecycle: proposed, untyped: true }
      # Every way in the chain carries oneway=yes with no twin mapped, which
      # would make an 870 km corridor route in one direction only.
      - drop_oneway
    osm:
      lifecycle: [construction, proposed]
      failure_modes:
        - lifecycle-value
        - unconnected
        - gauge-excluded
        - pruned
        - not-mapped
      note: >-
        Two gates fire at once. The surrounding Baltic network is 1520 mm and
        already excluded by the profile's gauge rule, so a promoted 1435 mm
        alignment has nothing compatible to attach to — it will be an island
        whatever the tagging says, until the corridor is continuous end to end.

        This bbox is the worst in the catalogue: 54.3–59.5°N is five degrees of
        latitude containing a great deal of unrelated planned track, all of
        which would pick up the 1435 default and silently become routable. Do
        not trust this project's output until scope.ways is filled in.

        SURVEYED 2026-08-29 on -d europe. Corridor 53856093, 1,154 km over 305
        ways (166 proposed, 127 construction, 12 abandoned), operator Rail
        Baltic Estonia OÜ, maxspeed 249, gauge 1435, opening_date 2026 —
        bbox [54.58, 23.95, 59.50, 25.29].

        Three findings. (a) 26 of the 305 ways use the bare `railway=<stage>`
        spelling, so `untyped: true` is required on both promotions or the
        chain is severed. (b) Every way is oneway=yes, hence drop_oneway.
        (c) It is attached to routable track at only THREE nodes over 1,154 km,
        which is precarious — one OSM edit could isolate the whole corridor.

        Note what this project does NOT cover: the Polish section from Warszawa
        is an upgrade of existing line, already tagged railway=rail, so it
        carries no lifecycle tags and there is nothing here to promote.
        Warszawa–Kaunas therefore routes on the conventional Polish network at
        conventional speeds (504 km, 325 min measured) no matter what this
        entry does. Modelling the Polish speed uplift needs scope.ways plus a
        `set: {maxspeed: ...}`, the way budapest-belgrade does it.

        The box also contains three things that must never be promoted and are
        currently excluded only by the profile's gauge rule, not by scope: the
        Rastenburger Kleinbahnen (292 km, abandoned, 750 mm), the
        Viljandi–Mõisaküla line (265 km, abandoned/razed, 750 mm,
        usage=tourism) and the proposed Helsinki–Tallinn tunnel (228 km,
        1524 mm).
    probe:
      from: { name: Warszawa Centralna, lat: 52.2286, lon: 21.0031 }
      to: { name: Riga Central, lat: 56.9465, lon: 24.1200 }
      via_bbox: [54.60, 23.30, 56.50, 24.60]
      baseline: no standard-gauge path
    sources:
      - title: Rail Baltica
        url: https://en.wikipedia.org/wiki/Rail_Baltica
      - title: Rail Baltica (CINEA)
        url: https://cinea.ec.europa.eu/featured-projects/rail-baltica-connecting-baltic-states-rest-europe-high-speed-train_en
      - title: Warsaw-Tallinn by 2030 is aspiration, not guarantee (BNS)
        url: https://www.baltictimes.com/warsaw-tallinn_train_service_by_2030_is_aspiration__not_guarantee_-rail_baltica_rep_-_bns_interview/

