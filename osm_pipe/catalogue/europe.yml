  - id: semmering-base-tunnel
    name: Semmering Base Tunnel
    corridor: Gloggnitz – Mürzzuschlag (AT)
    countries: [AT]
    impact: new-alignment
    opening:
      official: "2030"
      latest: "2030"
      note: >-
        27.3 km replacing a 60–80 km/h mountain line with 230 km/h. Around 30
        minutes off Vienna–Graz, which propagates to every Vienna–south night
        train path. Both dates agree, which makes it the cleanest date test in
        the catalogue: out at 2029, in at 2031.
    scope:
      bbox: [47.55, 15.60, 47.75, 15.90]
    changes:
      - promote: construction
      # Added after surveying: the corridor is not uniformly `construction`.
      # See osm.note — without this the chain breaks at the proposed segments
      # and the whole 58 km promotes to an unreachable island.
      - promote: proposed
    osm:
      lifecycle: [construction, proposed, abandoned]
      failure_modes: [lifecycle-value, namespaced-attrs, unconnected]
      verified: "2026-08-29"
      note: >-
        SURVEYED on -d austria. The corridor is one chain — 58.1 km over 23
        ways, ÖBB-Infrastruktur AG, opening_date=2027, maxspeed 160,
        electrified=contact_line, touching live track at 6 nodes — but it is
        NOT uniformly railway=construction: 15 construction, 6 proposed, 2
        abandoned.

        That mix is the whole story. Promoting only `construction` left the
        proposed segments as they were, breaking the chain, and the entire
        58 km promoted into an unreachable island:

          promote: construction          55.6 km promoted, 0.0 joined network
          + promote: proposed            56.8 km promoted, 56.8 joined network

        A textbook `unconnected` failure that was nothing to do with missing
        junctions — the corridor was severed by its own tagging, and no
        connector would have fixed it. Worth remembering before reaching for
        `osm-survey connectors`: check the lifecycle mix first.
    probe:
      from: { name: Wien Hbf, lat: 48.1852, lon: 16.3776 }
      to: { name: Graz Hbf, lat: 47.0725, lon: 15.4160 }
      via_bbox: [47.55, 15.60, 47.75, 15.90]
      baseline: the Semmering mountain line
    sources:
      - title: Semmering base tunnel (ÖBB-Infrastruktur)
        url: https://infrastruktur.oebb.at/en/projects-for-austria/railway-lines/southern-line-vienna-villach/semmering-base-tunnel
      - title: Semmering Base Tunnel
        url: https://en.wikipedia.org/wiki/Semmering_Base_Tunnel

  - id: koralmbahn
    name: Koralm Railway and Koralm Tunnel
    corridor: Graz – Klagenfurt (AT)
    countries: [AT]
    impact: new-link
    opening:
      official: "2025-12-14"
      latest: "2025-12-14"
      note: >-
        Already open: 130 km, a 33 km base tunnel, Graz–Klagenfurt in 41
        minutes against roughly three hours before.

        This is the control case for the whole pipeline. Its opening date is in
        the past, so it is in *every* network including today's, and its probe
        must therefore report ALREADY at every date. If it does not, the
        extract is stale or the import is broken — the one test that separates
        a tooling failure from a tagging failure.
    scope:
      bbox: [46.55, 14.25, 47.10, 15.50]
    changes:
      # Expect most of it as railway=rail already. Any remaining construction
      # ways are mapping lag, and are exactly what a promotion picks up — so
      # this is not `changes: []`, but it should be close to a no-op.
      - promote: construction
    osm:
      lifecycle: [rail, construction]
      failure_modes: [already-open]
    probe:
      from: { name: Graz Hbf, lat: 47.0725, lon: 15.4160 }
      to: { name: Klagenfurt Hbf, lat: 46.6167, lon: 14.3100 }
      via_bbox: [46.60, 14.80, 46.95, 15.25]
      baseline: via Bruck an der Mur and the Drau valley, roughly 3 hours
    sources:
      - title: Koralm Railway construction concludes (IRJ)
        url: https://www.railjournal.com/passenger/main-line/koralm-railway-construction-concludes/
      - title: Koralm Railway
        url: https://en.wikipedia.org/wiki/Koralm_Railway

