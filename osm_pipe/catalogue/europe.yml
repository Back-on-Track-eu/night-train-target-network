  - id: basque-y
    name: Basque Y
    corridor: Vitoria-Gasteiz – Bilbao – Donostia/San Sebastián (ES)
    countries: [ES]
    impact: new-link
    opening:
      official: "2027"
      latest: "2030"
      note: >-
        172 km of 1435 mm line in an otherwise 1668 mm region. The gauge is the
        point: it is the standard-gauge bridge between the French border and
        the Madrid network, so it is what makes a Paris–Madrid night train a
        single-gauge run rather than a gauge-change.
    scope:
      bbox: [42.80, -3.10, 43.35, -1.90]
    changes:
      - promote: construction
      - promote: proposed
    osm:
      lifecycle: [construction, proposed]
      failure_modes:
        - lifecycle-value
        - namespaced-attrs
        - unconnected
        - gauge-excluded
      note: >-
        Watch the gauge tag here specifically, and note that the library's
        gauge=1435 default is *correct* for this project and dangerous one box
        over. A promoted way that inherits the surrounding 1668 mm assumption,
        or an Iberian-gauge way that picks up our 1435 default, both produce
        wrong answers — and the profile's gauge rule makes the error silent.
        The strongest argument in the catalogue for scope.ways over a bbox.
    probe:
      from: { name: Bilbao Abando, lat: 43.2620, lon: -2.9280 }
      to: { name: Donostia/San Sebastián, lat: 43.3170, lon: -1.9760 }
