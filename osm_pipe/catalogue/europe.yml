  - id: budapest-belgrade
    name: Budapest–Belgrade railway
    corridor: Budapest – Kelebia – Subotica – Novi Sad – Beograd (HU, RS)
    countries: [HU, RS]
    impact: speed
    opening:
      official: "2026-02"
      latest: "2026"
      note: >-
        The existing alignment rebuilt for 200 km/h rather than a new one, so
        topology barely moves — but Budapest–Belgrade drops to 2 h 40, which
        changes the reachable set for a Vienna/Budapest night train. The
        Serbian section opened October 2025, the Hungarian February 2026, with
        through services held up by signalling.
    scope:
      bbox: [44.75, 19.30, 47.55, 20.60]
    changes:
      - promote: construction
      # The risk here is speed, not routability: OSM maxspeed on the rebuilt
      # sections lags the works, so the model under-rates the corridor. This
      # reaches only track this project promoted — the sections already tagged
      # railway=rail keep whatever maxspeed OSM has, and fixing those needs
      # scope.ways.
      - default: { maxspeed: "200" }
    osm:
      lifecycle: [rail, construction]
      failure_modes: [already-open, missing-maxspeed]
    probe:
